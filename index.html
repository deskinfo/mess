<style>
:root{--bg:#edf1fa;--sf:#fff;--ink:#14213d;--mut:#5a6785;--ln:#d3dcee;--ac:#1f4fb5;--ac2:#f2b630;--bad:#b3392f;--good:#1b7a45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Kalpurush","Hind Siliguri",system-ui,sans-serif}
header{background:var(--ac);color:#fff;padding:12px 16px}
header h1{margin:0;font-size:22px}header small{opacity:.85}
main{max-width:760px;margin:0 auto;padding:12px 12px 24px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
textarea{width:100%;min-height:150px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.wa{background:#1f9d55}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:18px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:14px}td.n,th.n{text-align:right}
.mi{width:58px;text-align:center}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.big .bt{grid-column:1/-1}.big .bt p{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0;padding:6px 0}.big .bt p+p{border-top:1px dashed rgba(127,127,127,.35)}.big .bt p span{font-size:14px;color:var(--mut)}.big .bt p b{display:inline;font-size:20px}.big .bt .bt-r{border-top:1px solid rgba(127,127,127,.45)!important}
.nd-l{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.nd-i{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(127,127,127,.25)}
.nd-i:first-of-type{border-top:0}
.nd-i .li-m{flex:1;min-width:0}.nd-i .li-m b{overflow-wrap:anywhere}.nd-i .li-m small{font-weight:400;color:var(--mut)}
.nd-i .li-m span{display:block;font-size:13px;color:var(--mut)}
.nd-i.dn .li-m b{text-decoration:line-through;opacity:.55}
.nd-a{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nd-b{min-height:36px;padding:4px 12px;font-size:14px}
.nd-me{font-style:normal;font-size:12px;padding:1px 8px;border-radius:10px;background:rgba(127,127,127,.2);color:var(--tx,inherit)}
.cmw{display:block}
.cm-fd{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:2px 2px 6px;margin-top:4px}
.cm-m{padding:10px 12px;border-radius:14px;background:rgba(127,127,127,.12);border:1px solid rgba(127,127,127,.18)}
.cm-m p{margin:0;overflow-wrap:anywhere}
.cm-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}.cm-f small{color:var(--mut);margin-left:auto}
.cm-tg{font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;background:rgba(127,127,127,.18)}.cm-tg.bad{color:var(--bad)}.cm-tg.good{color:var(--good)}
.cm-cp{margin-top:10px;padding-top:10px;border-top:1px solid rgba(127,127,127,.3)}
.cm-k{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.cm-kb{flex:1;min-height:36px;padding:4px 10px;border-radius:18px;border:1px solid var(--ln);background:rgba(127,127,127,.1);color:inherit;font:inherit;font-size:14px}
.cm-kb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cm-b{display:flex;gap:8px;align-items:stretch}.cm-b textarea{flex:1;min-height:56px;resize:none}
.cm-s{width:52px;min-width:52px;padding:0;display:flex;align-items:center;justify-content:center}
.cmc{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding:6px 2px 2px}
.cmc-c{flex:1 0 56px;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.cmc-c em{font-style:normal;font-weight:700;font-size:15px}
.cmc-t{width:100%;height:110px;display:flex;align-items:flex-end;justify-content:center}
.cmc-t i{display:block;width:70%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--bad);transition:height .3s}
.cmc.good .cmc-t i{background:var(--good)}
.cmc-c span{font-size:13px;color:var(--mut);overflow-wrap:anywhere;line-height:1.3}
@media (min-width:720px){.cmw{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:start}.cm-card,.cm-ch .card{margin-bottom:14px}.cm-fd{max-height:52vh}}
.clw{display:block}
.cl-l{display:flex;flex-direction:column;align-items:flex-start;gap:6px;flex:1;min-width:0}
.cl-a{display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:stretch}
.cl-a .btn{white-space:nowrap;min-height:38px;padding:4px 12px;font-size:14px}
.cl-a .btn[disabled]{opacity:.4;cursor:not-allowed}
.cl-c{display:flex;gap:6px;flex-wrap:wrap}.cl-c i{font-style:normal;font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(127,127,127,.15);color:var(--mut)}.cl-c i.y{color:var(--good);font-weight:600}
.cl-r>small{flex-basis:100%}
.cl-r{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:12px 0;border-top:1px solid rgba(127,127,127,.25)}
.cl-r:first-of-type{border-top:0}
.cl-n{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}.cl-n b{font-size:17px}.cl-n span{color:var(--mut);font-size:14px;flex-basis:100%}
.cl-b{font-size:14px;font-weight:600;padding:3px 10px;border-radius:12px;background:rgba(127,127,127,.15)}
.cl-b.ok{color:var(--good)}.cl-b.due{color:var(--bad)}.cl-b.now{color:var(--ac)}.cl-b.soon{color:var(--mut);font-weight:500}.cl-b small{font-weight:400}
.cl-r.me{background:rgba(127,127,127,.08);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:12px}
.cl-m{min-height:36px;padding:4px 12px;font-size:14px}
@media (min-width:720px){.clw{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}}
.big.lay{grid-template-columns:1.15fr 1fr 1fr;align-items:stretch}
.big.lay .bt{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;justify-content:center}
.big.lay .bw{grid-column:1/-1}
@media (max-width:560px){.big.lay{grid-template-columns:1fr 1fr}.big.lay .bt{grid-column:1/-1;grid-row:auto}.big.lay div:not(.bt) b{font-size:19px}}
.big div{background:var(--bg);border-radius:8px;padding:10px}.big b{display:block;font-size:22px}.big span{color:var(--mut);font-size:14px}
.due{color:var(--bad);font-weight:700}.ok{color:var(--good);font-weight:700}
.note{color:var(--mut);font-size:14px}
.tot td{font-weight:700;border-top:2px solid var(--ink)}
:root[data-theme^="glass"]{--bg:rgba(255,255,255,.3);--sf:rgba(255,255,255,.3);--ink:#0f1230;--mut:#31345a;--ln:rgba(255,255,255,.5);--ac:#2563ff;--ac2:#ff9500;--bad:#c8102e;--good:#0f7a3a}
:root[data-theme^="glass"] body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Kalpurush","Hind Siliguri",system-ui,sans-serif}
:root[data-theme^="glass"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
:root[data-theme="glass1"] body{background:linear-gradient(135deg,#dbe9ff,#eadbff 50%,#ffdfe9) fixed}
:root[data-theme="glass1"] body::before{background:radial-gradient(circle 50vmax at 15% 18%,rgba(80,210,255,.55),transparent),radial-gradient(circle 48vmax at 86% 14%,rgba(170,110,255,.45),transparent),radial-gradient(circle 52vmax at 82% 82%,rgba(255,120,170,.5),transparent),radial-gradient(circle 46vmax at 14% 86%,rgba(255,190,120,.5),transparent)}

:root[data-theme^="glass"] header{margin:10px 12px 0;padding:14px 18px 12px;border-radius:26px;color:var(--ink);background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.2));-webkit-backdrop-filter:blur(14px) saturate(170%) brightness(1.05);backdrop-filter:blur(14px) saturate(170%) brightness(1.05);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 1px rgba(255,255,255,.45),inset 1.5px 0 1px rgba(255,255,255,.6),inset -1.5px 0 1px rgba(255,255,255,.4),inset 3px 3px 6px rgba(0,200,255,.08),inset -3px -3px 6px rgba(255,60,140,.07),inset 0 0 26px rgba(255,255,255,.28),0 14px 34px rgba(20,25,40,.22)}
:root[data-theme^="glass"] header h1{font-size:24px;font-weight:700;letter-spacing:-.2px}
:root[data-theme^="glass"] header small{color:var(--mut);opacity:1}
:root[data-theme^="glass"] header select{border-radius:999px;padding:7px 14px;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.35));border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1.5px 1px #fff,inset 0 -2px 4px rgba(255,255,255,.4),0 6px 14px rgba(20,25,40,.2)}
:root[data-theme^="glass"] nav{margin:12px 12px 4px;padding:5px;gap:3px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.18));-webkit-backdrop-filter:blur(14px) saturate(170%) brightness(1.05);backdrop-filter:blur(14px) saturate(170%) brightness(1.05);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 1px rgba(255,255,255,.45),inset 1.5px 0 1px rgba(255,255,255,.6),inset -1.5px 0 1px rgba(255,255,255,.4),inset 3px 3px 6px rgba(0,200,255,.08),inset -3px -3px 6px rgba(255,60,140,.07),inset 0 0 26px rgba(255,255,255,.28),0 12px 30px rgba(20,25,40,.2);scrollbar-width:none}
:root[data-theme^="glass"] nav::-webkit-scrollbar{display:none}
:root[data-theme^="glass"] nav button{color:var(--ink);opacity:.85;border:0;border-radius:999px;padding:8px 14px;font-weight:600}
:root[data-theme^="glass"] nav button.on{opacity:1;color:var(--ac);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.55));box-shadow:inset 0 1.5px 1px #fff,inset 0 -2px 5px rgba(255,255,255,.5),0 4px 12px rgba(20,25,40,.25)}
:root[data-theme^="glass"] .card{position:relative;isolation:isolate;border-radius:28px;padding:16px;background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.22) 42%,rgba(255,255,255,.18) 66%,rgba(255,255,255,.4) 100%);-webkit-backdrop-filter:blur(14px) saturate(170%) brightness(1.05);backdrop-filter:blur(14px) saturate(170%) brightness(1.05);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -1.5px 1px rgba(255,255,255,.45),inset 1.5px 0 1px rgba(255,255,255,.6),inset -1.5px 0 1px rgba(255,255,255,.4),inset 3px 3px 6px rgba(0,200,255,.08),inset -3px -3px 6px rgba(255,60,140,.07),inset 0 0 26px rgba(255,255,255,.28),0 18px 40px rgba(20,25,40,.16),0 3px 8px rgba(20,25,40,.1),0 30px 36px -26px rgba(255,255,255,.9)}
:root[data-theme^="glass"] .card::before{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.16) 11%,transparent 24%),linear-gradient(112deg,transparent 58%,rgba(255,255,255,.22) 60%,rgba(255,255,255,.06) 66%,transparent 70%),linear-gradient(180deg,rgba(255,255,255,.35) 0%,transparent 14%)}
:root[data-theme^="glass"] .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.5px;background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.15) 28%,rgba(255,255,255,.04) 55%,rgba(255,255,255,.5) 82%,#fff 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
:root[data-theme^="glass"] .big div{border-radius:20px;background:linear-gradient(150deg,rgba(255,255,255,.6),rgba(255,255,255,.2));border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -2px 6px rgba(255,255,255,.3),0 6px 14px rgba(20,25,40,.12)}
:root[data-theme^="glass"] th,:root[data-theme^="glass"] td{border-bottom:1px solid rgba(255,255,255,.55);box-shadow:0 1px 0 rgba(20,25,40,.1)}

:root[data-theme^="glass"] input,:root[data-theme^="glass"] select,:root[data-theme^="glass"] textarea{border-radius:14px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 3px 7px rgba(20,25,40,.2),inset 0 -1px 0 rgba(255,255,255,.7)}
:root[data-theme^="glass"] header select{border-radius:999px}

/* ===== নতুন রিয়েলিস্টিক গ্লাস থিম (১২–১৯) ===== */
:root[data-theme="glass12"] body{background:linear-gradient(160deg,#e6f4ff,#f3fbff 50%,#e4efff) fixed}

<script>
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const dm=d=>d?bn(d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4)):'';
// তারিখ বাছাইয়ের ঘর: ফোনের ভাষা যাই হোক, সবসময় দিন/মাস/বছর দেখায়
const dinp=(id,v,oc,wd)=>`<div class="dw"><input type="text" readonly id="${id}t" value="${wd?dmy(v):dm(v)}"><input type="date" class="dov" id="${id}" value="${v}" onclick="try{this.showPicker()}catch(e){}" onchange="${oc||'dov(this)'}"></div>`;
function dov(el){const t=document.getElementById(el.id+'t');if(t)t.value=dm(el.value)}
const dmy=d=>bn(d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4))+' ('+WD[new Date(d+'T00:00:00').getDay()]+')';

{let t='';try{t=localStorage.getItem('theme')||''}catch(e){}if(t==='glass')t='glass1';if(!THEMES[t])t='glass1';applyTheme(t)}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{members:[],days:{},bazar:[],deposits:[],extras:[],open:{},nd:{}};
S.nd=S.nd||{};S.needs=S.needs||{};S.cm=S.cm||{};S.cmu=S.cmu||{};S.cl=S.cl||{};S.cooks=S.cooks||[];
let tab='meal',D=tomorrow(),M=today().slice(0,7);
const CLOUD=!!(window.FB&&FB.apiKey);
let prof=null;try{prof=JSON.parse(localStorage.getItem('mprof'))}catch(e){}
let role=CLOUD?'':'manager',me=(()=>{try{return localStorage.getItem('me')||(prof&&prof.id)||''}catch(e){return ''}})(),authMode='up';
const pk=p=>String(p||'').replace(/\D/g,'').slice(-10);
function syncRole(){if(!CLOUD){role='manager';return}
  let m=me&&S.members.find(x=>x.id===me);
  if(!m){let ph='';try{ph=localStorage.getItem('mph')||''}catch(e){}const f=ph&&S.members.find(x=>pk(x.phone)===ph);if(f){me=f.id;m=f;try{localStorage.setItem('me',me)}catch(e){}}}
 // এই ডিভাইসে আগে লগইন করা থাকলে, ক্লাউডের ডাটা আসার আগে/অফলাইনেও লগইন পেজ দেখাবে না
  if(!m&&!window.cloudReady&&prof&&(!me||prof.id===me)){me=prof.id;m={id:prof.id,name:prof.name,phone:prof.phone};S.members.push(m)}
  let sr='';try{sr=localStorage.getItem('role')||''}catch(e){}
  role=m?(S.managerId?(S.managerId===me?'manager':'member'):(sr==='manager'?'manager':'member')):'';

function clFines(m){const o={};clSlots(m).filter(x=>x.st==='miss'&&x.mid).forEach(x=>{(o[x.mid]=o[x.mid]||{amt:0,items:[]});o[x.mid].amt+=CL_FINE;o[x.mid].items.push(x)});return o}
function calc(m){
  const days=Object.entries(S.days).filter(([d])=>d.startsWith(m));
  const meals={};S.members.forEach(x=>meals[x.id]=0);
  days.forEach(([,v])=>Object.entries(v.meals).forEach(([id,a])=>{if(id in meals)meals[id]+=(+a[0]||0)+(+a[1]||0)}));
  const totalMeals=Object.values(meals).reduce((a,b)=>a+b,0);
  const bazar=S.bazar.filter(b=>b.date.startsWith(m)).reduce((a,b)=>a+b.amt,0);
  const totalDep=S.deposits.filter(d=>d.date.startsWith(m)).reduce((a,b)=>a+b.amt,0),remain=totalDep-bazar;
  const n=S.members.length||1,rate=totalMeals?bazar/totalMeals:0;
  const xs=S.extras.filter(e=>e.month===m&&e.k!=='n'),ns=S.extras.filter(e=>e.month===m&&e.k==='n');
  const sum=a=>a.reduce((t,e)=>t+e.amt,0),xT=sum(xs),nT=sum(ns),nd=S.nd[m]||{};
  /* বাসা ভাড়া: রিফাত বাদে বাকি সবার মাঝে সমান ভাগ; অন্য সব খরচ সবার মাঝে সমান ভাগ */
  const exN=S.members.filter(isRifat).length,rn=S.members.length-exN,rentOn=rn>0&&exN>0;

  const rows=S.members.map(x=>{

    const fine=clf[x.id]?clf[x.id].amt:0,fineL=clf[x.id]?clf[x.id].items:[];
    return {m:x,meals:meals[x.id],food,dep,net,xS,nS,next,fine,fineL,total:net+xS+nS+next+fine};
  });
  return {totalMeals,bazar,totalDep,remain,rate,n,xs,ns,xT,nT,rows,sh,rn,rentOn,rentT,othT};
}

const FNT='"Kalpurush","Hind Siliguri",sans-serif';
async function fontsReady(){try{await Promise.all([document.fonts.load('20px "Kalpurush"'),document.fonts.load('700 20px "Kalpurush"')])}catch(e){}}
async function saveJpg(cv,fname,text){
  const b=await new Promise(res=>cv.toBlob(res,'image/jpeg',.92));
  if(await nativeShare(b,fname,text))return;
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname;a.click();
}
function fitTxt(g,t,w,px,bold){let p=px;do{g.font=(bold?'700 ':'400 ')+p+'px '+FNT;if(g.measureText(t).width<=w)break;p--}while(p>13);return p}
function wrapTxt(g,t,w){
  const out=[];let line='';
  const push=x=>{out.push(x)};
  for(const word of String(t).split(' ')){
    let ww=word;
    while(g.measureText(ww).width>w&&ww.length>1){let k=ww.length;while(k>1&&g.measureText(ww.slice(0,k)).width>w)k--;if(line){push(line);line=''}push(ww.slice(0,k));ww=ww.slice(k)}
    const tt=line?line+' '+ww:ww;
    if(g.measureText(tt).width>w&&line){push(line);line=ww}else line=tt;
  }
  if(line||!out.length)push(line);
  return out;
}
async function expMeal(){
  const mb=S.members;if(!mb.length){alert('কোনো সদস্য নেই');return}
  const Y=+M.slice(0,4),Mo=+M.slice(5),nd=new Date(Y,Mo,0).getDate();
  const tl={},tn={};mb.forEach(x=>{tl[x.id]=0;tn[x.id]=0});
  const rows=[];let any=false;
  for(let i=1;i<=nd;i++){
    const d=M+'-'+String(i).padStart(2,'0'),dd=S.days[d],r={d,v:{}};
    mb.forEach(x=>{const a=(dd&&dd.meals&&dd.meals[x.id])||[0,0],l=+a[0]||0,n=+a[1]||0;r.v[x.id]=[l,n];tl[x.id]+=l;tn[x.id]+=n;if(l||n)any=true});
    rows.push(r);
  }
  if(!any){alert(mn(M)+' মাসে কোনো মিলের তথ্য নেই');return}
  await fontsReady();
  const PAD=28,CW=76,RH=38,n=mb.length,W=Math.max(780,PAD*2+230+n*2*CW),DC=W-PAD*2-n*2*CW;
  const top=100,H=top+16+44+38+nd*RH+6+RH+RH+16+56+24;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  iceBg(g,W,H);
  g.fillStyle='#0b78d1';g.fillRect(0,0,W,top);
  g.fillStyle='#fff';g.textAlign='left';g.font='700 32px '+FNT;g.fillText('মিল হিসাব — '+mn(M),PAD,50);
  g.font='400 22px '+FNT;g.fillText('মোট সদস্য: '+bn(n)+' জন',PAD,82);
  const ink='#14213d',lite='#9bb4c9',line='#b9d6ee',ac='#0b78d1';
  const cx=i=>PAD+DC+i*2*CW; /* member group left */
  let y=top+16;
  /* header */
  g.fillStyle='#cfe6f8';g.fillRect(PAD,y,W-PAD*2,44+38);
  g.fillStyle=ac;g.textAlign='left';g.font='700 23px '+FNT;g.fillText('তারিখ',PAD+12,y+30);
  g.textAlign='center';
  mb.forEach((x,i)=>{const mw=2*CW-10;fitTxt(g,x.name,mw,23,1);g.fillStyle=ac;g.fillText(x.name,cx(i)+CW,y+30);g.font='700 19px '+FNT;g.fillText('দুপুর',cx(i)+CW/2,y+44+26);g.fillText('রাত',cx(i)+CW*1.5,y+44+26)});
  y+=44+38;
  /* rows */
  rows.forEach((r,k)=>{
    if(k%2===0){g.fillStyle='rgba(255,255,255,.55)';g.fillRect(PAD,y,W-PAD*2,RH)}
    g.fillStyle=ink;g.textAlign='left';g.font='400 22px '+FNT;g.fillText(dm(r.d),PAD+12,y+26);
    g.textAlign='right';g.fillStyle='#4f6b86';g.font='400 19px '+FNT;g.fillText(WD[new Date(r.d+'T00:00:00').getDay()],PAD+DC-14,y+26);
    g.textAlign='center';g.font='400 23px '+FNT;
    mb.forEach((x,i)=>{const v=r.v[x.id];[0,1].forEach(j=>{g.fillStyle=v[j]?ink:lite;g.fillText(bn(v[j]),cx(i)+CW*(j+.5),y+26)})});
    y+=RH;
  });
  /* column separators */
  g.fillStyle=line;
  for(let i=0;i<=n;i++)g.fillRect(cx(i)-1,top+16+44,1.5,y-(top+16+44));
  /* totals */
  g.fillStyle=ac;g.fillRect(PAD,y+2,W-PAD*2,2);y+=6;
  g.fillStyle=ink;g.textAlign='left';g.font='700 23px '+FNT;g.fillText('মোট মিল',PAD+12,y+26);
  g.textAlign='center';mb.forEach((x,i)=>{g.fillText(bn(tl[x.id]),cx(i)+CW*.5,y+26);g.fillText(bn(tn[x.id]),cx(i)+CW*1.5,y+26)});
  y+=RH;
  g.fillStyle='rgba(255,255,255,.55)';g.fillRect(PAD,y,W-PAD*2,RH);
  g.fillStyle=ink;g.textAlign='left';g.fillText('জনপ্রতি মোট',PAD+12,y+26);
  g.textAlign='center';mb.forEach((x,i)=>g.fillText(bn(tl[x.id]+tn[x.id]),cx(i)+CW,y+26));
  y+=RH+16;
  const all=mb.reduce((t,x)=>t+tl[x.id]+tn[x.id],0);
  g.fillStyle=ac;g.fillRect(0,y,W,56);g.fillStyle='#fff';g.textAlign='left';g.font='700 27px '+FNT;g.fillText('সর্বমোট মিল',PAD,y+37);g.textAlign='right';g.fillText(bn(all)+' টি',W-PAD,y+37);
  await saveJpg(cv,'meal-report-'+M+'.jpg',mn(M)+' মাসের মিল হিসাব');
}
async function expBazar(){

  if(!list.length){alert(mn(M)+' মাসে কোনো বাজার নেই');return}

  const PAD=28,W=900,dW=170,bW=170,aW=140,iW=W-PAD*2-dW-bW-aW,x1=PAD+dW,x2=x1+iW,x3=x2+bW,LH=32;

    g.fillText(dm(r.b.date),PAD+12,y+LH-4);
    r.ls.forEach((t,i)=>g.fillText(t,x1+12,y+LH-4+i*LH));
    const nm=mem(r.b.by).name;fitTxt(g,nm,bW-24,23);g.fillText(nm,x2+12,y+LH-4);
    g.font='700 23px '+FNT;g.textAlign='right';g.fillText('৳'+f2(r.b.amt),W-PAD-12,y+LH-4);
    y+=r.h;
  });
  g.fillStyle=ac;g.fillRect(PAD,y+2,W-PAD*2,2);y+=6+16;
  g.fillStyle=ac;g.fillRect(0,y,W,56);g.fillStyle='#fff';g.textAlign='left';g.font='700 27px '+FNT;g.fillText('সর্বমোট বাজার',PAD,y+37);g.textAlign='right';g.fillText('৳'+f2(tot),W-PAD,y+37);
  await saveJpg(cv,'bazar-report-'+M+'.jpg',mn(M)+' মাসের বাজার হিসাব');
}

<script type="module">
if(window.FB&&FB.apiKey){
  try{
    const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const F=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db=F.getFirestore(A.initializeApp(FB)),ref=F.doc(db,'mess','main');
    let pending=false;
    window.cloud={
      push(){F.setDoc(ref,JSON.parse(JSON.stringify(S))).catch(e=>alert('সেভ হয়নি: '+e.message))},
      meal(d,id,a){F.updateDoc(ref,new F.FieldPath('days',d,'meals',id),a).catch(e=>alert('সেভ হয়নি: '+e.message))},
      cl(m,key,f,v){F.updateDoc(ref,f?new F.FieldPath('cl',m,key,f):new F.FieldPath('cl',m,key),v===null?F.deleteField():v).catch(x=>alert('সেভ হয়নি: '+x.message))},
      cm(id,e,tks){const a=[ref,new F.FieldPath('cm',id),e];tks.forEach(t=>a.push(new F.FieldPath('cmu',t),true));F.updateDoc(...a).catch(x=>alert('সেভ হয়নি: '+x.message))},
      need(id,done,by){F.updateDoc(ref,new F.FieldPath('needs',id,'done'),done,new F.FieldPath('needs',id,'doneBy'),by||'').catch(x=>alert('সেভ হয়নি: '+x.message))},
      bazar(e){F.updateDoc(ref,'bazar',F.arrayUnion(e)).catch(x=>alert('সেভ হয়নি: '+x.message))},
      lock(d,id,a){F.updateDoc(ref,new F.FieldPath('days',d,'meals',id),a,new F.FieldPath('days',d,'lk',id),true).catch(e=>alert('সেভ হয়নি: '+e.message))},
      enter(name,phone,mode){
        return F.runTransaction(db,async tx=>{
          const snap=await tx.get(ref),d=snap.exists()?snap.data():{},ms=(d.members||[]).slice(),key=pk(phone);
          let m=ms.find(x=>pk(x.phone)===key);
          if(!m){
            if(mode==='in')return {err:'এই নম্বরে কোনো সদস্য নেই। আগে সাইন আপ করুন।'};
            m={id:uid(),name,phone};ms.push(m);
          }
          const mgrId=d.managerId||m.id,upd={members:ms};
          if(!d.managerId)upd.managerId=mgrId;
          tx.set(ref,upd,{merge:true});
          return {id:m.id,name:m.name,phone:m.phone,mgr:mgrId===m.id};
        });
      }
    };
    F.onSnapshot(ref,snap=>{
      if(snap.exists())S=Object.assign({members:[],days:{},bazar:[],deposits:[],extras:[],open:{},nd:{},cooks:[],needs:{},cm:{},cmu:{},cl:{}},snap.data());
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      window.cloudReady=true;
      const el=document.activeElement;
      if(el&&/INPUT|SELECT|TEXTAREA/.test(el.tagName))pending=true;else render();
    },e=>alert('ডাটাবেসে সংযোগ হয়নি: '+e.message));
    document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(render,80)}});
  }catch(e){alert('Firebase চালু হয়নি: '+e.message)}
}
</script>
